name: Build QUREO Assistant Windows Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Package desktop app
        run: pyinstaller --noconfirm --onefile --windowed --name QUREO-Assistant --hidden-import browser_helper --collect-all playwright main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build setup installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: QUREO-Assistant-Installer
          path: dist/QUREO-Assistant-Setup.exe
          if-no-files-found: error
